services:
  web:
    build: .
    ports:
      - "8895:80"   # (optional, but not needed if you want 8895 only)
    #volumes:
    #  - .:/var/www/html
    env_file:
      - docker-compose.env
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_COMPOSE_DB_ROOT_PASS}
      MYSQL_DATABASE: ${DOCKER_COMPOSE_DB_NAME}
      MYSQL_USER: ${DOCKER_COMPOSE_DB_USER}
      MYSQL_PASSWORD: ${DOCKER_COMPOSE_DB_PASS}
    ports:
      - "8896:3306"
    volumes:
      - ./mysql.cnf:/etc/mysql/my.cnf
      - ./my_first_db.sql.gz:/docker-entrypoint-initdb.d/my_first_db.sql.gz  # Mount init.sql script
